<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>codex-agent</title>
<style>
  :root {
    --bg: #12151b;
    --panel: #181c24;
    --panel-2: #1e232d;
    --border: #2a2f3a;
    --text: #e4e6eb;
    --muted: #8b92a5;
    --dim: #565d6e;
    --amber: #e8a33d;
    --amber-dim: #a87a34;
    --sage: #5fb88a;
    --coral: #e8604c;
    --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px; overflow: hidden;
  }
  #app { display: flex; height: 100vh; }

  /* ---------- sidebar ---------- */
  #sidebar {
    width: 240px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    padding: 14px 0;
  }
  .sb-section { padding: 0 14px; margin-bottom: 18px; }
  .sb-label {
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim);
    margin-bottom: 8px; font-weight: 600;
  }
  .sb-path {
    font-family: var(--mono); font-size: 11.5px; color: var(--muted); word-break: break-all;
    line-height: 1.5; padding: 6px 8px; background: var(--panel-2); border-radius: 4px;
    border: 1px solid var(--border);
  }
  .sb-item {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 7px 8px; border-radius: 4px; cursor: pointer; font-size: 12.5px;
    color: var(--muted); margin-bottom: 2px; transition: background 0.12s;
  }
  .sb-item:hover { background: var(--panel-2); color: var(--text); }
  .sb-item.active { background: var(--panel-2); color: var(--amber); border-left: 2px solid var(--amber); padding-left: 6px; }
  .sb-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-item-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .sb-item .meta { font-size: 10px; color: var(--dim); }
  .sb-item .rename { opacity: 0; color: var(--muted); font-size: 11px; padding: 0 2px; }
  .sb-item:hover .rename { opacity: 0.6; }
  .sb-item .rename:hover { opacity: 1; color: var(--amber); }
  .sb-item .del { opacity: 0; color: var(--coral); font-size: 13px; padding: 0 2px; }
  .sb-item:hover .del { opacity: 0.7; }
  .sb-item .del:hover { opacity: 1; }
  .sb-item .archive { opacity: 0; color: var(--muted); font-size: 11px; padding: 0 2px; }
  .sb-item:hover .archive { opacity: 0.6; }
  .sb-item .archive:hover { opacity: 1; color: var(--amber); }
  .sb-item .restore { opacity: 0.6; color: var(--sage); font-size: 12px; padding: 0 2px; }
  .sb-item:hover .restore { opacity: 1; }
  .sb-btn { width: 100%; background: transparent; border: 1px dashed var(--border); color: var(--muted); padding: 7px; border-radius: 4px; font-size: 12px; cursor: pointer; font-family: var(--sans); margin-top: 4px; transition: all 0.12s; }
  .sb-btn:hover { border-color: var(--amber-dim); color: var(--amber); }
  .sb-btn-quiet { border-style: solid; border-color: transparent; opacity: 0.7; font-size: 11px; }
  .sb-btn-quiet:hover { opacity: 1; background: var(--panel-2); }
  .sb-row-btns { display: flex; flex-direction: column; gap: 4px; }
  .sb-btn-secondary { font-size: 11px; opacity: 0.85; }
  #archived-list { margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--border); }

  /* ---------- folder browser modal ---------- */
  #browse-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none;
    align-items: center; justify-content: center; z-index: 60;
  }
  #browse-overlay.show { display: flex; }
  #browse-card {
    width: 480px; max-height: 520px; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5); overflow: hidden;
  }
  .browse-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .browse-title { font-weight: 600; font-size: 13.5px; }
  #browse-close-btn {
    background: transparent; border: none; color: var(--muted); font-size: 14px;
    cursor: pointer; padding: 2px 6px; border-radius: 4px;
  }
  #browse-close-btn:hover { color: var(--text); background: var(--panel-2); }
  .browse-path {
    font-family: var(--mono); font-size: 11.5px; color: var(--amber); padding: 10px 16px;
    border-bottom: 1px solid var(--border); word-break: break-all; flex-shrink: 0;
    background: var(--panel-2);
  }
  .browse-list { flex: 1; overflow-y: auto; padding: 6px; min-height: 220px; }
  .browse-list::-webkit-scrollbar { width: 8px; }
  .browse-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .browse-row {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 5px;
    cursor: pointer; font-family: var(--mono); font-size: 12.5px; color: var(--text);
  }
  .browse-row:hover { background: var(--panel-2); }
  .browse-row .icon { color: var(--amber-dim); flex-shrink: 0; }
  .browse-row .tag { margin-left: auto; font-size: 10px; color: var(--dim); font-family: var(--sans); }
  .browse-empty { color: var(--dim); font-family: var(--sans); font-size: 12px; padding: 20px; text-align: center; }
  .browse-footer {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 16px; border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .browse-error { font-size: 11px; color: var(--coral); font-family: var(--sans); }
  .browse-footer-btns { display: flex; gap: 8px; margin-left: auto; }
  .browse-footer-btns button {
    font-family: var(--sans); font-size: 12.5px; font-weight: 600; padding: 8px 14px;
    border-radius: 5px; cursor: pointer; border: 1px solid var(--border);
  }
  .browse-footer-btns .deny { background: transparent; color: var(--muted); }
  .browse-footer-btns .deny:hover { border-color: var(--coral); color: var(--coral); }
  .browse-footer-btns .approve { background: var(--amber); color: #1a1408; border: none; }
  .browse-footer-btns .approve:hover { background: #f0af50; }
  .sb-spacer { flex: 1; }

  /* ---------- top bar ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    flex-shrink: 0; display: flex; flex-direction: column;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .topbar-row {
    min-height: 40px; flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 6px 16px;
  }
  #topbar-row1 { border-bottom: 1px solid var(--border); }
  #brand {
    display: flex; align-items: center; gap: 7px; flex-shrink: 0; padding-right: 12px;
    margin-right: 2px; border-right: 1px solid var(--border); color: var(--muted);
  }
  #brand-logo { width: 20px; height: 18px; color: var(--text); flex-shrink: 0; }
  #brand-name { font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; }
  @media (max-width: 900px) {
    #brand-name { display: none; }
    #brand { padding-right: 8px; }
  }
  #topbar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sage); flex-shrink: 0; }
  #topbar .dot.busy { background: var(--amber); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  #topbar select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 8px; font-family: var(--mono); font-size: 11.5px;
    flex-shrink: 0;
  }
  #mode-select.mode-full { border-color: var(--coral); color: var(--coral); }
  #mode-select.mode-readonly { border-color: var(--sage); color: var(--sage); }
  #model-picker { position: relative; }
  #model-input {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 8px; font-family: var(--mono); font-size: 11.5px;
    width: 260px; outline: none;
  }
  #model-input:focus { border-color: var(--amber-dim); }
  #model-dropdown {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; width: 420px;
    max-height: 320px; overflow-y: auto; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 40; padding: 4px;
  }
  #model-dropdown.show { display: block; }
  #model-dropdown::-webkit-scrollbar { width: 7px; }
  #model-dropdown::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .model-opt {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 6px 8px;
    border-radius: 4px; cursor: pointer;
  }
  .model-opt:hover, .model-opt.highlighted { background: var(--panel); color: var(--amber); }
  .model-opt-id { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .model-opt-price {
    flex-shrink: 0; font-size: 10.5px; color: var(--dim); white-space: nowrap;
  }
  .model-opt:hover .model-opt-price, .model-opt.highlighted .model-opt-price { color: var(--amber-dim); }
  .model-dropdown-empty { font-family: var(--sans); font-size: 11.5px; color: var(--dim); padding: 8px; }
  #model-refresh-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 4px; width: 26px; height: 26px; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  #model-refresh-btn:hover { border-color: var(--amber-dim); color: var(--amber); }
  #model-refresh-btn.loading { animation: spin 0.8s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  #auto-toggle {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 4px; padding: 4px 9px; cursor: pointer; font-family: var(--sans);
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  #auto-toggle:hover { border-color: var(--amber-dim); color: var(--amber); }
  #auto-toggle.active { background: rgba(232,163,61,0.14); border-color: var(--amber); color: var(--amber); }
  #auto-profile-select {
    background: var(--panel-2); color: var(--amber); border: 1px solid var(--amber-dim);
    border-radius: 4px; padding: 4px 7px; font-family: var(--sans); font-size: 11px; font-weight: 600;
  }
  #aa-status {
    font-family: var(--mono); font-size: 10.5px; color: var(--dim); white-space: nowrap;
    max-width: 200px; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0;
  }
  #aa-refresh-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 4px; width: 22px; height: 22px; cursor: pointer; font-size: 11px;
    display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0;
  }
  #aa-refresh-btn:hover { border-color: var(--amber-dim); color: var(--amber); }
  #aa-refresh-btn.loading { animation: spin 0.8s linear infinite; }
  #topbar .status-text { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  #topbar .spacer { flex: 1; }

  /* ---------- chat ---------- */
  #chat { flex: 1; overflow-y: auto; padding: 20px 0 10px; }
  .msg-row { padding: 3px 24px; margin-bottom: 2px; }
  .msg-user {
    font-family: var(--mono); font-size: 13px; color: var(--text);
    display: flex; gap: 8px; margin: 14px 0 6px; align-items: flex-start;
  }
  .msg-user .prompt { color: var(--amber); flex-shrink: 0; }
  .msg-user .user-text { flex: 1; white-space: pre-wrap; }
  .edit-user-btn {
    background: transparent; border: none; color: var(--dim); font-size: 12px;
    cursor: pointer; padding: 0 2px; opacity: 0; flex-shrink: 0; transition: opacity 0.12s;
  }
  .msg-user:hover .edit-user-btn { opacity: 0.7; }
  .edit-user-btn:hover { opacity: 1 !important; color: var(--amber); }
  .edit-user-textarea {
    flex: 1; background: var(--panel-2); border: 1px solid var(--amber-dim); border-radius: 5px;
    color: var(--text); font-family: var(--mono); font-size: 13px; padding: 8px 10px;
    resize: vertical; min-height: 40px; outline: none;
  }
  .edit-user-btns { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
  .edit-user-btns button {
    font-family: var(--sans); font-size: 11px; font-weight: 600; padding: 5px 10px;
    border-radius: 4px; cursor: pointer; border: 1px solid var(--border); white-space: nowrap;
  }
  .edit-cancel-btn { background: transparent; color: var(--muted); }
  .edit-cancel-btn:hover { border-color: var(--coral); color: var(--coral); }
  .edit-save-btn { background: var(--amber); color: #1a1408; border: none; }
  .edit-save-btn:hover { background: #f0af50; }
  .msg-assistant {
    border-left: 2px solid var(--sage); padding: 2px 0 2px 14px; margin: 6px 0 0;
    line-height: 1.6; color: #d3d6dd;
  }
  .md-p { margin: 0 0 10px; white-space: pre-wrap; }
  .md-p:last-child { margin-bottom: 0; }
  .md-heading { margin: 14px 0 8px; color: var(--text); font-family: var(--sans); line-height: 1.3; }
  .md-heading:first-child { margin-top: 0; }
  h3.md-heading { font-size: 15px; font-weight: 700; }
  h4.md-heading { font-size: 14px; font-weight: 700; }
  h5.md-heading, h6.md-heading { font-size: 13px; font-weight: 600; color: var(--muted); }
  .md-code {
    font-family: var(--mono); font-size: 0.92em; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; color: var(--amber);
  }
  .md-pre {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; margin: 8px 0; overflow-x: auto;
  }
  .md-pre code { font-family: var(--mono); font-size: 12px; color: #d3d6dd; background: none; border: none; padding: 0; }
  .md-list { margin: 4px 0 10px; padding-left: 22px; }
  .md-list li { margin: 3px 0; }
  .md-table {
    border-collapse: collapse; margin: 10px 0; font-size: 12.5px; width: 100%; max-width: 100%;
    display: block; overflow-x: auto;
  }
  .md-table th, .md-table td {
    border: 1px solid var(--border); padding: 5px 10px; text-align: left; white-space: nowrap;
  }
  .md-table th { background: var(--panel-2); color: var(--text); font-weight: 600; }
  .md-table td { color: #d3d6dd; }
  .msg-assistant strong { color: var(--text); font-weight: 700; }
  .msg-assistant em { font-style: italic; color: var(--muted); }
  .msg-footer {
    border-left: 2px solid var(--sage); display: flex; gap: 6px;
    padding: 6px 0 14px 14px; margin: 0 0 4px;
  }
  .footer-btn {
    background: transparent; border: 1px solid transparent; color: var(--dim);
    font-family: var(--mono); font-size: 10.5px; padding: 3px 7px; border-radius: 4px;
    cursor: pointer; opacity: 0.75; transition: all 0.12s;
  }
  .footer-btn:hover { opacity: 1; color: var(--amber); border-color: var(--amber-dim); background: var(--panel-2); }
  .msg-tool {
    font-family: var(--mono); font-size: 11.5px; color: var(--dim);
    display: flex; align-items: center; gap: 6px; padding: 3px 0 3px 14px; margin: 2px 0;
  }
  .msg-tool .icon { flex-shrink: 0; }
  .msg-tool.ok .icon { color: var(--sage); }
  .msg-tool.err .icon { color: var(--coral); }
  .msg-note {
    font-family: var(--sans); font-size: 11.5px; color: var(--dim); font-style: italic;
    display: flex; align-items: baseline; gap: 6px; padding: 3px 0 3px 14px; margin: 2px 0;
  }
  .msg-note .icon { flex-shrink: 0; }
  .msg-stopped {
    font-family: var(--mono); font-size: 11.5px; color: var(--coral); opacity: 0.85;
    padding: 4px 24px; margin: 4px 0;
  }
  .msg-tool .name { color: var(--muted); }
  .msg-tool .label {
    font-family: var(--sans); font-size: 12px; color: var(--muted);
    white-space: nowrap; flex-shrink: 0;
  }
  .msg-tool.err .label { color: var(--coral); }
  .msg-tool .detail {
    color: var(--dim); opacity: 0.5; font-size: 10.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .msg-system {
    font-size: 11.5px; color: var(--dim); font-style: italic;
    padding: 4px 10px; border-left: 2px solid var(--border); margin: 6px 0;
  }
  .msg-system.err { color: var(--coral); border-left-color: var(--coral); }
  #compact-btn {
    font-size: 10.5px; padding: 2px 8px; opacity: 0.75; cursor: pointer;
  }
  #compact-btn:hover { opacity: 1; }
  .status-text.warn { color: var(--amber); }
  .status-text.danger { color: var(--coral); }
  .msg-note .text { cursor: pointer; }
  .msg-note .text.clamp {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .tool-group { margin: 4px 0; }
  .tool-group-toggle {
    background: transparent; border: none; color: var(--dim); font-family: var(--mono);
    font-size: 11px; padding: 3px 0 3px 14px; cursor: pointer; text-align: left;
    opacity: 0.8; transition: opacity 0.12s;
  }
  .tool-group-toggle:hover { opacity: 1; color: var(--muted); }
  .tool-group-body { display: none; border-left: 1px solid var(--border); margin-left: 4px; }
  .tool-group-body.show { display: block; }

  /* ---------- turn windowing: collapses older turns, keeps the last 2 in full detail ---------- */
  .turn-wrapper { margin: 0; }
  .turn-toggle {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: transparent; border: none; cursor: pointer; padding: 8px 24px;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  .turn-toggle:hover { background: var(--panel-2); }
  .turn-toggle-arrow { color: var(--dim); flex-shrink: 0; width: 10px; }
  .turn-toggle-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .turn-toggle-status { flex-shrink: 0; font-size: 11px; }
  .turn-toggle-status.done { color: var(--sage); }
  .turn-toggle-status.error { color: var(--coral); }
  .turn-toggle-status.stopped { color: var(--coral); opacity: 0.7; }
  .turn-detail { display: none; }
  .turn-wrapper.expanded > .turn-detail { display: block; }
  .msg-error {
    font-family: var(--mono); font-size: 12px; color: var(--coral);
    padding: 8px 14px; margin: 6px 0; background: rgba(232,96,76,0.08);
    border-left: 2px solid var(--coral); border-radius: 0 4px 4px 0;
  }
  .msg-upload-note {
    font-family: var(--sans); font-size: 12.5px; color: var(--sage);
    padding: 8px 14px; margin: 6px 0; background: rgba(95,184,138,0.08);
    border-left: 2px solid var(--sage); border-radius: 0 4px 4px 0;
  }
  .msg-upload-note .md-p { margin: 0; }
  .msg-upload-note .md-code { color: var(--sage); }
  .thinking { font-family: var(--mono); font-size: 12px; color: var(--dim); padding: 4px 24px 4px 38px; }
  .thinking .blink { animation: pulse 1.1s infinite; }

  /* ---------- input ---------- */
  #inputbar {
    display: flex; align-items: center; gap: 10px; padding: 14px 20px;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  #inputbar .prompt-glyph { color: var(--amber); font-family: var(--mono); font-size: 15px; }
  #inputbox {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: var(--mono); font-size: 13.5px; padding: 10px 12px;
    resize: none; outline: none; max-height: 140px;
  }
  #inputbox:focus { border-color: var(--amber-dim); }
  #sendbtn {
    background: var(--amber); color: #1a1408; border: none; border-radius: 6px;
    padding: 10px 16px; font-family: var(--sans); font-weight: 600; font-size: 12.5px;
    cursor: pointer; flex-shrink: 0;
  }
  #sendbtn:disabled { background: var(--dim); color: var(--panel); cursor: not-allowed; }
  #sendbtn:hover:not(:disabled) { background: #f0af50; }
  #stopbtn {
    background: transparent; color: var(--coral); border: 1px solid var(--coral); border-radius: 6px;
    padding: 10px 14px; font-family: var(--sans); font-weight: 600; font-size: 12.5px;
    cursor: pointer; flex-shrink: 0;
  }
  #stopbtn:hover { background: rgba(232,96,76,0.12); }

  /* ---------- message queue (while agent is busy) ---------- */
  #queue-panel {
    display: none; flex-direction: column; gap: 4px; padding: 8px 20px;
    background: var(--panel); border-top: 1px solid var(--border); max-height: 160px; overflow-y: auto;
  }
  #queue-panel.show { display: flex; }
  .queue-header {
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--sans); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 2px;
  }
  .queue-clear-btn {

<script>
const chatEl = document.getElementById('chat');
const emptyState = document.getElementById('empty-state');
const inputBox = document.getElementById('inputbox');
const sendBtn = document.getElementById('sendbtn');
const stopBtn = document.getElementById('stopbtn');
const statusDot = document.getElementById('status-dot');
const providerSelect = document.getElementById('provider-select');
const modeSelect = document.getElementById('mode-select');
const modelInput = document.getElementById('model-input');
const modelDropdown = document.getElementById('model-dropdown');
const modelRefreshBtn = document.getElementById('model-refresh-btn');
const autoToggle = document.getElementById('auto-toggle');
const autoProfileSelect = document.getElementById('auto-profile-select');
const aaStatusEl = document.getElementById('aa-status');
const aaRefreshBtn = document.getElementById('aa-refresh-btn');
const sessionLabel = document.getElementById('session-label');
const tokenUsageEl = document.getElementById('token-usage');
const keyQuotaEl = document.getElementById('key-quota');
const compactBtn = document.getElementById('compact-btn');
let lastQuota = null; // cached so the reset countdown can keep ticking between requests
const rootPathEl = document.getElementById('root-path');
const sessionListEl = document.getElementById('session-list');
const overlay = document.getElementById('overlay');
const approvalTool = document.getElementById('approval-tool');
const approvalArgs = document.getElementById('approval-args');
const browseOverlay = document.getElementById('browse-overlay');
const browsePathEl = document.getElementById('browse-path');
const browseListEl = document.getElementById('browse-list');
const browseErrorEl = document.getElementById('browse-error');

let busy = false;
let currentToolRow = null;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Compact markdown renderer for assistant replies — bold/italic/inline code,
// fenced code blocks, tables, lists, headers, paragraphs. Escapes HTML first
// so nothing in the model's own text can inject markup; the tags below are
// the only HTML ever introduced.
function renderMarkdown(raw) {
  const lines = escapeHtml(raw).split('\n');
  let html = '';
  let i = 0;
  let inCode = false;
  let codeBuf = [];
  let listBuf = [];
  let listType = null;

  function inlineFmt(s) {
    s = s.replace(/`([^`]+)`/g, '<code class="md-code">$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    return s;
  }
  function flushList() {
    if (!listBuf.length) return;
    const tag = listType === 'ol' ? 'ol' : 'ul';
    html += `<${tag} class="md-list">${listBuf.map(li => `<li>${inlineFmt(li)}</li>`).join('')}</${tag}>`;
    listBuf = []; listType = null;
  }

  while (i < lines.length) {
    const line = lines[i];

    if (/^```/.test(line)) {
      flushList();
      if (!inCode) { inCode = true; codeBuf = []; i++; continue; }
      inCode = false;
      html += `<pre class="md-pre"><code>${codeBuf.join('\n')}</code></pre>`;
      i++; continue;
    }
    if (inCode) { codeBuf.push(line); i++; continue; }

    // table: a "| ... |" line followed by a "|---|---|" separator line
    if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes('-')) {
      flushList();
      const headerCells = line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      html += `<table class="md-table"><thead><tr>${headerCells.map(c => `<th>${inlineFmt(c)}</th>`).join('')}</tr></thead><tbody>`;
      i += 2;
      while (i < lines.length && /^\s*\|/.test(lines[i])) {
        const cells = lines[i].trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        html += `<tr>${cells.map(c => `<td>${inlineFmt(c)}</td>`).join('')}</tr>`;
        i++;
      }
      html += '</tbody></table>';
      continue;
    }

    const heading = line.match(/^(#{1,4})\s+(.*)$/);
    if (heading) {
      flushList();
      const level = Math.min(heading[1].length + 2, 6);
      html += `<h${level} class="md-heading">${inlineFmt(heading[2])}</h${level}>`;
      i++; continue;
    }

    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ul) { if (listType && listType !== 'ul') flushList(); listType = 'ul'; listBuf.push(ul[1]); i++; continue; }
    if (ol) { if (listType && listType !== 'ol') flushList(); listType = 'ol'; listBuf.push(ol[1]); i++; continue; }

    if (line.trim() === '') { flushList(); i++; continue; }

    flushList();
    html += `<p class="md-p">${inlineFmt(line)}</p>`;
    i++;
  }
  flushList();
  if (inCode && codeBuf.length) html += `<pre class="md-pre"><code>${codeBuf.join('\n')}</code></pre>`;
  return html || escapeHtml(raw);
}

function scrollToBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

function hideEmptyState() { if (emptyState) emptyState.style.display = 'none'; }

// ---------- turn windowing: keep the last 2 turns expanded, fold older ones into a collapsed summary ----------
let turnWrappers = [];
let currentTurnWrapper = null;
let currentTurnStatusSet = false;
const TURNS_KEPT_EXPANDED = 2;

function startNewTurn(promptText) {
  hideEmptyState();
  const wrapper = document.createElement('div');
  wrapper.className = 'turn-wrapper expanded';
  const label = promptText.length > 70 ? promptText.slice(0, 70) + '…' : promptText;
  wrapper.innerHTML = `
    <button class="turn-toggle">
      <span class="turn-toggle-arrow">▾</span>
      <span class="turn-toggle-label">${escapeHtml(label)}</span>
      <span class="turn-toggle-status"></span>
    </button>
    <div class="turn-detail"></div>
  `;
  chatEl.appendChild(wrapper);
  wrapper.querySelector('.turn-toggle').addEventListener('click', () => {
    const nowExpanded = wrapper.classList.toggle('expanded');
    wrapper.querySelector('.turn-toggle-arrow').textContent = nowExpanded ? '▾' : '▸';
  });
  currentTurnWrapper = wrapper;
  currentTurnStatusSet = false;
  turnWrappers.push(wrapper);
  enforceTurnWindow();
  return wrapper;
}

function contentContainer() {
  return currentTurnWrapper ? currentTurnWrapper.querySelector('.turn-detail') : chatEl;
}

function enforceTurnWindow() {
  turnWrappers.forEach((w, i) => {
    const shouldExpand = i >= turnWrappers.length - TURNS_KEPT_EXPANDED;
    w.classList.toggle('expanded', shouldExpand);
    const arrow = w.querySelector('.turn-toggle-arrow');
    if (arrow) arrow.textContent = shouldExpand ? '▾' : '▸';
  });
}

function setTurnStatus(status) {
  if (!currentTurnWrapper) return;
  currentTurnStatusSet = true;
  const el = currentTurnWrapper.querySelector('.turn-toggle-status');
  if (!el) return;
  const icons = { done: '✓', error: '✗', stopped: '■' };
  el.textContent = icons[status] || '';
  el.className = 'turn-toggle-status ' + (status || '');
}

function resetTurnWindow() {
  turnWrappers = [];
  currentTurnWrapper = null;
  currentTurnStatusSet = false;
}

let lastUserRow = null;

function appendUserMessage(text, turnStart) {
  startNewTurn(text);
  const row = document.createElement('div');
  row.className = 'msg-row';
  if (turnStart) row.dataset.turnstart = turnStart;
  row.innerHTML = `
    <div class="msg-user">
      <span class="prompt">›</span>
      <span class="user-text">${escapeHtml(text)}</span>
      <button class="edit-user-btn" title="edit and resend">✎</button>
    </div>`;
  contentContainer().appendChild(row);
  scrollToBottom();
  row.querySelector('.edit-user-btn').addEventListener('click', () => startEditUserMessage(row, text));
  lastUserRow = row;
  return row;
}

function startEditUserMessage(row, currentText) {
  if (busy) return;
  const userDiv = row.querySelector('.msg-user');
  userDiv.innerHTML = `
    <span class="prompt">›</span>
    <textarea class="edit-user-textarea">${escapeHtml(currentText)}</textarea>
    <div class="edit-user-btns">
      <button class="edit-cancel-btn">Cancel</button>
      <button class="edit-save-btn">Save &amp; resend</button>
    </div>`;
  const textarea = userDiv.querySelector('.edit-user-textarea');
  textarea.focus();
  textarea.setSelectionRange(textarea.value.length, textarea.value.length);
  userDiv.querySelector('.edit-cancel-btn').addEventListener('click', () => {
    userDiv.innerHTML = `<span class="prompt">›</span><span class="user-text">${escapeHtml(currentText)}</span><button class="edit-user-btn" title="edit and resend">✎</button>`;
    userDiv.querySelector('.edit-user-btn').addEventListener('click', () => startEditUserMessage(row, currentText));
  });
  userDiv.querySelector('.edit-save-btn').addEventListener('click', () => submitEdit(row, textarea.value));
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitEdit(row, textarea.value); }
  });
}

async function submitEdit(row, newText) {
  newText = newText.trim();
  if (!newText) return;
  const turnStart = Number(row.dataset.turnstart);
  if (!turnStart) { appendErrorMessage("Can't edit this message yet — try again in a moment."); return; }
  const res = await fetch('/api/session/edit', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ turnStart, newText })
  });
  const data = await res.json();
  if (!data.ok) { appendErrorMessage(`Couldn't edit: ${data.error}`); return; }
  setBusy(true);
  refreshState();
}

let awaitingCheckpointFor = null;

function appendAssistantMessage(text) {
  hideEmptyState();
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `
    <div class="msg-assistant">${renderMarkdown(text)}</div>
    <div class="msg-footer">
      <button class="footer-btn rerun-btn" style="display:none">↻ rerun this prompt</button>
      <button class="footer-btn branch-btn" style="display:none">⑂ branch after this reply</button>
    </div>
  `;
  contentContainer().appendChild(row);
  scrollToBottom();
  awaitingCheckpointFor = row; // the next 'checkpoint' SSE event will enable this row's branch button
  return row;
}

function renderAssistantMessageWithCheckpoint(text, checkpoint, final, turnStart) {
  // used when replaying saved history — everything is already known, no need to wait for an SSE event
  const row = appendAssistantMessage(text);
  awaitingCheckpointFor = null;
  if (checkpoint) enableBranchButton(row, checkpoint);
  if (final && turnStart) enableRerunButton(row, turnStart);
  return row;
}

function enableBranchButton(row, checkpoint) {
  const btn = row.querySelector('.branch-btn');
  if (!btn) return;
  btn.style.display = 'inline-block';
  btn.dataset.checkpoint = checkpoint;
}

function enableRerunButton(row, turnStart) {
  const btn = row.querySelector('.rerun-btn');
  if (!btn) return;
  btn.style.display = 'inline-block';
  btn.dataset.turnstart = turnStart;
}

let currentToolGroup = null; // { row, toggleBtn, body, total, failed } — one per turn's worth of tool activity

function ensureToolGroup() {
  if (currentToolGroup) return currentToolGroup;
  hideEmptyState();
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `
    <div class="tool-group">
      <button class="tool-group-toggle">▸ working…</button>
      <div class="tool-group-body"></div>
    </div>`;
  contentContainer().appendChild(row);
  const toggleBtn = row.querySelector('.tool-group-toggle');
  const body = row.querySelector('.tool-group-body');
  toggleBtn.addEventListener('click', () => {
    const open = body.classList.toggle('show');
    toggleBtn.textContent = toggleBtn.textContent.replace(open ? '▸' : '▾', open ? '▾' : '▸');
  });
  currentToolGroup = { row, toggleBtn, body, total: 0, failed: 0 };
  return currentToolGroup;
}

function updateToolGroupHeader() {
  if (!currentToolGroup) return;
  const { toggleBtn, total, failed, lastLabel } = currentToolGroup;
  const arrow = toggleBtn.textContent.trim().startsWith('▾') ? '▾' : '▸';
  const failText = failed ? ` · ${failed} failed` : '';
  // Collapsed groups now say what the agent is actually doing, not just how many steps it took.
  const what = lastLabel ? ` · ${lastLabel.length > 52 ? lastLabel.slice(0, 52) + '…' : lastLabel}` : '';
  toggleBtn.textContent = `${arrow} ${total} step${total === 1 ? '' : 's'}${failText}${what}`;
}

function endToolGroup() { currentToolGroup = null; } // next tool call / note (if any) starts a fresh group

function appendProcessNote(text) {
  const group = ensureToolGroup();
  group.total++;
  const row = document.createElement('div');
  row.className = 'msg-note';
  // Full text, clamped to 3 lines — click to expand. Truncating at 160 chars used to
  // cut these off mid-sentence, which is exactly where the explanation lived.
  row.innerHTML = `<span class="icon">·</span><span class="text clamp">${escapeHtml(text)}</span>`;
  const textEl = row.querySelector('.text');
  textEl.title = 'Click to expand';
  textEl.addEventListener('click', () => textEl.classList.toggle('clamp'));
  group.body.appendChild(row);
  if (currentToolGroup) currentToolGroup.lastLabel = text.slice(0, 60);
  updateToolGroupHeader();
  scrollToBottom();
}

// Turn a tool call into a line a human can read at a glance.
// Returns { label, detail } — label is the plain-English action, detail is the
// raw args (still available, but tucked into the row's title tooltip).
function describeToolCall(name, args = {}) {
  const base = p => (p ? String(p).split('/').filter(Boolean).pop() : '');
  const q = s => (s ? `"${String(s).slice(0, 48)}"` : '');

  switch (name) {
    case 'read_file':  return { label: `Read ${base(args.path)}` };
    case 'write_file': return { label: `Wrote ${base(args.path)}` };
    case 'edit_file':  return { label: `Edited ${base(args.path)}` };
    case 'list_dir':   return { label: `Listed ${base(args.path) || 'working directory'}` };
    case 'system_info':        return { label: 'Checked system info' };
    case 'list_serial_ports':  return { label: 'Listed serial ports' };
    case 'arduino_list_boards':return { label: 'Listed connected boards' };
    case 'arduino_compile':    return { label: `Compiled ${base(args.sketch_path)}` };
    case 'arduino_flash':      return { label: `Flashed ${base(args.sketch_path)} → ${args.port || 'board'}` };
    case 'serial_monitor':     return { label: `Captured serial on ${args.port}${args.duration_s ? ` for ${args.duration_s}s` : ''}` };
    case 'logic_analyzer_scan':    return { label: 'Scanned for logic analyzer' };
    case 'logic_analyzer_capture': return { label: `Captured ${args.samples || ''} samples${args.channels ? ` on ${args.channels}` : ''}`.trim() };
    case 'run_command':        return describeCommand(args.command || '');
    default:                   return { label: name.replace(/_/g, ' ') };
  }

  function describeCommand(raw) {
    let cmd = raw.trim();
    let host = '';

    // Strip the shell scaffolding that hides the actual action:
    // env prefixes, `set -euo pipefail`, VAR=$(...) assignments, `cd X &&`.
    cmd = cmd.replace(/^set\s+-[a-z]+\s+\S*\s*/i, '');
    cmd = cmd.replace(/^(?:[A-Z_]+=\$\([^)]*\)\s*;?\s*)+/g, '');
    cmd = cmd.replace(/^test\s+-n[^;]*;\s*/i, '');
    cmd = cmd.replace(/\\n/g, ' ').trim();

    // Pull the remote host out of an ssh invocation, then unwrap to the real command.
    const ssh = cmd.match(/ssh\s+(?:-\S+\s+(?:\S+\s+)?)*([\w.@$-]+@[\w.$:{}[\]-]+|\$REMOTE)\s+(.*)$/s);
    if (ssh) {
      const user = ssh[1].split('@')[0];
      host = user && !user.startsWith('$') ? ` on ${user}` : ' on remote';
      cmd = ssh[2].replace(/^['"]|['"]$/g, '').trim();
    }
    const cd = cmd.match(/^cd\s+(\S+)\s*&&\s*(.*)$/s);
    let where = '';
    if (cd) { where = ` in ${base(cd[1])}`; cmd = cd[2].trim(); }

    const head = cmd.split(/\s+/)[0];
    const rest = cmd.slice(head.length).trim();

    // Search / inspect
    if (/^(grep|rg|ag)$/.test(head)) {
      const term = rest.match(/(["'])(.*?)\1/) || rest.match(/-\w+\s+(\S+)/);
      return { label: `Searched for ${q(term ? (term[2] ?? term[1]) : rest.slice(0, 40))}${where}${host}` };
    }
    if (head === 'find')  return { label: `Looked for files${where}${host}` };
    if (head === 'ls')    return { label: `Listed files${where}${host}` };
    if (/^(cat|head|tail|sed)$/.test(head)) {
      const file = rest.split(/\s+/).filter(t => !t.startsWith('-') && !/^["'\d,]/.test(t)).pop();
      return { label: `Read ${base(file) || 'file'}${host}` };
    }
    if (head === 'ps' || /pgrep/.test(head)) return { label: `Checked running processes${host}` };
    if (head === 'diff' || head === 'cmp')   return { label: `Compared files${where}` };
    if (head === 'tailscale') return { label: 'Looked up the remote machine address' };

    // Build / version control / hardware
    if (head === 'git')  return { label: `git ${rest.split(/\s+/)[0] || ''}`.trim() + where };
    if (/arduino-cli/.test(cmd)) {
      if (/upload|flash/.test(cmd)) return { label: `Flashed firmware${host}` };
      if (/compile/.test(cmd))      return { label: `Compiled firmware${host}` };
      return { label: `Ran arduino-cli${host}` };
    }
    if (/^(make|cmake|npm|pnpm|yarn|pip|cargo|pytest|python3?|node)$/.test(head)) {
      return { label: `Ran ${head} ${rest.split(/\s+/)[0] || ''}`.trim() + where + host };
    }
    if (/^(cp|scp|rsync)$/.test(head)) return { label: `Copied files${host || ' to remote'}` };
    if (/^(mkdir|rm|mv|chmod)$/.test(head)) return { label: `${head} ${base(rest.split(/\s+/).pop())}`.trim() + host };
    if (head === 'echo') return { label: `Printed output${host}` };

    return { label: `Ran ${head}${where}${host}` };
  }
}

function appendToolCall(name, args) {
  const group = ensureToolGroup();
  group.total++;
  const row = document.createElement('div');
  row.className = 'msg-tool';
  const { label } = describeToolCall(name, args);
  const raw = JSON.stringify(args);
  row.title = raw; // full, unmodified args on hover — nothing is hidden, just moved out of the way
  row.innerHTML =
    `<span class="icon">◌</span>` +
    `<span class="label">${escapeHtml(label)}</span>` +
    `<span class="detail">${escapeHtml(raw.slice(0, 70))}</span>`;
  if (currentToolGroup) currentToolGroup.lastLabel = label;
  group.body.appendChild(row);
  updateToolGroupHeader();
  scrollToBottom();
  return row;
}

function resolveToolCall(rowEl, name, result) {
  if (!rowEl) return;
  rowEl.classList.add(result.ok ? 'ok' : 'err');
  rowEl.querySelector('.icon').textContent = result.ok ? '✓' : '✗';
  if (!result.ok) {
    const labelEl = rowEl.querySelector('.label');
    if (labelEl && !labelEl.textContent.startsWith('Failed')) labelEl.textContent = `Failed — ${labelEl.textContent.toLowerCase()}`;
    rowEl.querySelector('.detail').textContent = (result.error || 'failed').slice(0, 90);
  }
  if (!result.ok && currentToolGroup) { currentToolGroup.failed++; updateToolGroupHeader(); }
  scrollToBottom();
}

function appendErrorMessage(text) {
  hideEmptyState();
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `<div class="msg-error">${escapeHtml(text)}</div>`;
  contentContainer().appendChild(row);
  scrollToBottom();
}

// Quiet status line for things the agent did to the conversation itself
// (compaction), as opposed to an answer or an error.
function appendSystemNote(text, isError = false) {
  hideEmptyState();
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `<div class="msg-system${isError ? ' err' : ''}">⤺ ${escapeHtml(text)}</div>`;
  contentContainer().appendChild(row);
  scrollToBottom();
}

function appendUploadNote(text) {
  hideEmptyState();
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `<div class="msg-upload-note">${renderMarkdown(text)}</div>`;
  contentContainer().appendChild(row);
  scrollToBottom();
}

function appendStoppedNote() {
  hideEmptyState();
  endToolGroup();
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `<div class="msg-stopped">■ Stopped</div>`;
  contentContainer().appendChild(row);
  scrollToBottom();
}

let thinkingEl = null;
function showThinking() {
  if (thinkingEl) return;
  thinkingEl = document.createElement('div');
  thinkingEl.className = 'thinking';
  thinkingEl.innerHTML = 'working<span class="blink">…</span>';
  contentContainer().appendChild(thinkingEl);
  scrollToBottom();
}
function hideThinking() {
  if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
}

function setBusy(b) {
  busy = b;
  statusDot.classList.toggle('busy', b);
  sendBtn.textContent = b ? 'Queue' : 'Send';
  stopBtn.style.display = b ? 'inline-block' : 'none';
  // input stays active while busy — typing queues a message instead of being blocked
  if (!b) hideThinking();
}

stopBtn.addEventListener('click', async () => {
  await fetch('/api/stop', { method: 'POST' });
});

// ---------- SSE ----------
const evtSource = new EventSource('/api/events');
evtSource.onmessage = (e) => {
  const data = JSON.parse(e.data);
  switch (data.type) {
    case 'user_message':
      if (lastUserRow && !lastUserRow.dataset.turnstart) lastUserRow.dataset.turnstart = data.turnStart;
      break;
    case 'thinking':
      showThinking();
      if (data.model && autoModeOn) modelInput.value = data.model;
      break;
    case 'assistant_message': {
      hideThinking();
      if (data.final) {
        endToolGroup(); // close out this turn's collapsed process group before showing the real answer
        const row = appendAssistantMessage(data.text);
        if (data.turnStart) enableRerunButton(row, data.turnStart);
      } else {
        appendProcessNote(data.text); // interim "let me check X" style notes fold into the collapsed summary, not their own bubble
      }
      break;
    }
    case 'checkpoint':
      if (awaitingCheckpointFor) { enableBranchButton(awaitingCheckpointFor, data.index); awaitingCheckpointFor = null; }
      break;
    case 'tool_call': hideThinking(); currentToolRow = appendToolCall(data.name, data.args); break;
    case 'tool_result': resolveToolCall(currentToolRow, data.name, data.result); break;
    case 'approval_request': showApprovalModal(data); break;
    case 'error': hideThinking(); appendErrorMessage(data.message); setTurnStatus('error'); break;
    case 'stopped': hideThinking(); appendStoppedNote(); setTurnStatus('stopped'); break;
    case 'done': setTurnStatus('done'); break;
    case 'usage': updateTokenUsage(data.usage, data.contextLimit); break;
    case 'quota': updateKeyQuota(data.quota); break;
    case 'compacting': hideThinking(); appendSystemNote('Context is filling up — summarising earlier messages…'); break;
    case 'compacted': {
      const saved = data.before && data.after ? ` (${formatTokenCount(data.before)} → ${formatTokenCount(data.after)})` : '';
      appendSystemNote(`Compacted ${data.summarised} earlier messages into a summary${saved}. Full history saved to disk.`);
      break;
    }
    case 'compact_failed': appendSystemNote(`Couldn't compact: ${data.error}`, true); break;
    case 'idle':
      setBusy(false); endToolGroup(); updateTokenUsage(data.usage, data.contextLimit); updateKeyQuota(data.quota);
      if (!currentTurnStatusSet) setTurnStatus('done'); // safety net — done/error/stopped should always precede idle, but don't leave a turn unmarked if something unexpected happens
      handleIdleQueueAdvance();
      break;
  }
};

chatEl.addEventListener('click', async (e) => {
  const branchBtn = e.target.closest('.branch-btn');
  if (branchBtn && branchBtn.dataset.checkpoint) {
    if (busy) return;
    const res = await fetch('/api/session/branch', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ upto: Number(branchBtn.dataset.checkpoint) }) // no name — server auto-names it; rename anytime from the sidebar
    });
    const data = await res.json();
    if (!data.ok) { appendErrorMessage(`Couldn't branch: ${data.error}`); return; }
    refreshState();
    return;
  }

  const rerunBtn = e.target.closest('.rerun-btn');
  if (rerunBtn && rerunBtn.dataset.turnstart) {
    if (busy) return;
    const res = await fetch('/api/session/rerun', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ turnStart: Number(rerunBtn.dataset.turnstart) })
    });
    const data = await res.json();
    if (!data.ok) { appendErrorMessage(`Couldn't rerun: ${data.error}`); return; }
    refreshState(); // shows the truncated history immediately; the new answer streams in right after over SSE
  }
});

// ---------- approval modal ----------
function showApprovalModal(data) {
  approvalTool.textContent = data.tool;
  approvalArgs.textContent = JSON.stringify(data.args, null, 2);
  overlay.classList.add('show');
  overlay.dataset.id = data.id;
}
document.getElementById('approve-btn').onclick = () => respondApproval(true);
document.getElementById('deny-btn').onclick = () => respondApproval(false);
async function respondApproval(approved) {

  overlay.classList.remove('show');
  await fetch('/api/approve', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ id, approved }) });

// ---------- sending messages, with a queue for while the agent is busy ----------
let messageQueue = [];
let queueSeq = 0;
let steerText = null; // set when "steer now" is clicked — the next idle picks this up instead of the queue front

async function actuallySend(text) {
  endToolGroup();
  appendUserMessage(text);
  setBusy(true);
  const res = await fetch('/api/message', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ text }) });
  if (!res.ok) {
    const err = await res.json().catch(() => ({error: 'request failed'}));
    appendErrorMessage(err.error || 'Failed to send message');
    setBusy(false);
  }
}

function queueMessage(text) {
  messageQueue.push({ id: 'q' + (queueSeq++), text });
  renderQueue();
}

function renderQueue() {
  const panel = document.getElementById('queue-panel');
  if (messageQueue.length === 0) { panel.classList.remove('show'); panel.innerHTML = ''; return; }
  panel.classList.add('show');
  panel.innerHTML = `<div class="queue-header">Queued (${messageQueue.length}) <button class="queue-clear-btn">clear all</button></div>` +
    messageQueue.map(item => `
      <div class="queue-item" data-id="${item.id}">
        <span class="queue-text">${escapeHtml(item.text)}</span>
        <button class="queue-steer-btn" data-id="${item.id}" title="Interrupt current work and send this now">▶ steer now</button>
        <button class="queue-remove-btn" data-id="${item.id}" title="Remove from queue">✕</button>
      </div>
    `).join('');
  panel.querySelectorAll('.queue-steer-btn').forEach(btn => btn.addEventListener('click', () => steerWithQueuedMessage(btn.dataset.id)));
  panel.querySelectorAll('.queue-remove-btn').forEach(btn => btn.addEventListener('click', () => removeFromQueue(btn.dataset.id)));
  const clearBtn = panel.querySelector('.queue-clear-btn');
  if (clearBtn) clearBtn.addEventListener('click', () => { messageQueue = []; renderQueue(); });
}

function removeFromQueue(id) {
  messageQueue = messageQueue.filter(m => m.id !== id);
  renderQueue();
}

async function steerWithQueuedMessage(id) {
  const idx = messageQueue.findIndex(m => m.id === id);
  if (idx === -1) return;
  const [item] = messageQueue.splice(idx, 1);
  renderQueue();
  steerText = item.text; // picked up by handleIdleQueueAdvance once the current turn actually stops
  if (busy) await fetch('/api/stop', { method: 'POST' });
  else { steerText = null; await actuallySend(item.text); } // nothing was running — just send it directly
}

function handleIdleQueueAdvance() {
  if (steerText) {
    const t = steerText;
    steerText = null;
    actuallySend(t);
  } else if (messageQueue.length > 0) {
    const next = messageQueue.shift();
    renderQueue();
    actuallySend(next.text);
  }
}

async function sendMessage() {
  const text = inputBox.value.trim();
  if (!text) return;
  inputBox.value = '';
  inputBox.style.height = 'auto';
  if (busy) { queueMessage(text); return; }
  await actuallySend(text);
}
sendBtn.onclick = sendMessage;
inputBox.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
inputBox.addEventListener('input', () => {
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 140) + 'px';
});

// ---------- sidebar: sessions ----------
function formatTokenCount(n) {
  if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k';
  return String(n);
}
function updateTokenUsage(usage, contextLimit) {
  if (!usage) { tokenUsageEl.textContent = ''; return; }
  const used = usage.totalTokens || 0;
  // Explicitly labelled "context" — this is how full the model's context window is
  // for THIS conversation. It says nothing about account credit; a key can be out of
  // money with 90% of the context still free.
  if (contextLimit) {
    const left = Math.max(contextLimit - used, 0);
    const pct = Math.round((used / contextLimit) * 100);
    tokenUsageEl.textContent = `context ${formatTokenCount(used)}/${formatTokenCount(contextLimit)} (${pct}%)`;
    tokenUsageEl.title = `${formatTokenCount(left)} tokens of context left before this conversation must be trimmed. This is not your account balance.`;
    tokenUsageEl.classList.toggle('warn', pct >= 85);
  } else {
    tokenUsageEl.textContent = `context ${formatTokenCount(used)}`;
    tokenUsageEl.title = 'Context used. Model context limit unknown — hit ↻ next to the model field to fetch it.';
  }
}

// OpenRouter reports `limit_reset` as a window name ('daily' | 'weekly' | 'monthly'),
// not a timestamp — so compute the next boundary ourselves. Resets run at midnight
// UTC; weekly windows run Monday–Sunday, so the boundary is the next Monday 00:00 UTC.
function nextResetDate(resetType) {
  if (!resetType) return null;
  const now = new Date();
  const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
  switch (String(resetType).toLowerCase()) {
    case 'daily':
      d.setUTCDate(d.getUTCDate() + 1);
      return d;
    case 'weekly': {
      const dow = d.getUTCDay();               // 0 = Sunday
      const daysUntilMonday = (8 - (dow === 0 ? 7 : dow)) % 7 || 7;
      d.setUTCDate(d.getUTCDate() + daysUntilMonday);
      return d;
    }
    case 'monthly':
      return new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 1));
    default:
      return null;
  }
}

// "Mon 10 Aug, 5:30 am" in the user's own timezone — a UTC timestamp is useless
// if you have to do the offset arithmetic in your head.
function formatResetDate(date) {
  return date.toLocaleString(undefined, {
    weekday: 'short', day: 'numeric', month: 'short',
    hour: 'numeric', minute: '2-digit'
  });
}

function formatCountdown(date) {
  const ms = date - new Date();
  if (ms <= 0) return 'any moment';
  const mins = Math.floor(ms / 60000);
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h >= 24) { const days = Math.floor(h / 24); return `${days}d ${h % 24}h`; }
  if (h >= 1) return `${h}h ${m}m`;
  return `${m}m`;
}

function updateKeyQuota(quota) {
  if (!keyQuotaEl) return;
  if (quota) lastQuota = quota;
  if (!quota || quota.limit == null) {
    // No cap set on the key (or non-OpenRouter provider) — show spend only, if known.
    keyQuotaEl.textContent = quota && quota.usage != null ? `key $${quota.usage.toFixed(2)} spent` : '';
    keyQuotaEl.classList.remove('warn', 'danger');
    return;
  }
  const remaining = quota.remaining ?? 0;
  const reset = nextResetDate(quota.reset);
  const exhausted = remaining <= 0;

  if (exhausted && reset) {
    // The only thing that matters once you're blocked is when you can work again.
    keyQuotaEl.textContent = `key limit hit · resets ${formatResetDate(reset)} (in ${formatCountdown(reset)})`;
  } else {
    keyQuotaEl.textContent = `key $${remaining.toFixed(2)} left${quota.reset ? ` · resets in ${reset ? formatCountdown(reset) : quota.reset}` : ''}`;
  }

  keyQuotaEl.title =
    `API key spending cap: $${remaining.toFixed(2)} remaining of $${quota.limit.toFixed(2)}.` +
    (reset ? `\nResets ${formatResetDate(reset)} — that's ${quota.reset}, at midnight UTC.` : '') +
    `\nThis is the limit that produces 403 errors — separate from the context counter.`;

  keyQuotaEl.classList.toggle('danger', exhausted);
  keyQuotaEl.classList.toggle('warn', !exhausted && remaining < quota.limit * 0.1);
}

// Keep the countdown honest while the window sits open, rather than freezing at
// whatever it said when the last request finished.
setInterval(() => { if (lastQuota) updateKeyQuota(lastQuota); }, 60_000);

compactBtn.addEventListener('click', async () => {
  if (busy) { appendSystemNote('Wait for the current reply to finish before compacting.', true); return; }
  compactBtn.disabled = true;
  try {
    const res = await fetch('/api/compact', { method: 'POST' });
    const data = await res.json();
    if (!data.ok) appendSystemNote(`Couldn't compact: ${data.error}`, true);
    else refreshState();
  } catch (e) {
    appendSystemNote(`Couldn't compact: ${e.message}`, true);
  } finally { compactBtn.disabled = false; }
});

async function refreshState() {
  const res = await fetch('/api/state');
  const state = await res.json();
  rootPathEl.textContent = state.root;
  sessionLabel.textContent = 'chat: ' + state.sessionName;
  setAutoModeUI(state.autoMode, state.model, state.autoProfiles, state.autoProfile, state.aaStatus);
  setBusy(state.busy);
  modeSelect.value = state.mode;
  modeSelect.className = state.mode === 'full' ? 'mode-full' : state.mode === 'readonly' ? 'mode-readonly' : '';
  updateTokenUsage(state.usage, state.contextLimit);
  updateKeyQuota(state.quota);

  providerSelect.innerHTML = state.providers.map(p =>
    `<option value="${p.name}" ${p.name === state.provider ? 'selected' : ''}>${p.label}</option>`
  ).join('');

  renderSessions(state.sessions, state.sessionName);
  renderBookmarks(state.bookmarks, state.root);
  fetchModelList(state.provider);

  // replay history
  endToolGroup();
  lastUserRow = null;
  resetTurnWindow();
  messageQueue = []; steerText = null; renderQueue();
  chatEl.querySelectorAll('.turn-wrapper, .msg-row, .thinking').forEach(el => el.remove());
  if (state.history.length === 0) {
    emptyState.style.display = 'block';
  } else {
    hideEmptyState();
    for (const item of state.history) {
      if (item.type === 'user_message') appendUserMessage(item.text, item.turnStart);
      else if (item.type === 'assistant_message') {
        renderAssistantMessageWithCheckpoint(item.text, item.checkpoint, item.final, item.turnStart);
        if (item.final) setTurnStatus('done'); // replayed history is always settled — no error/stopped state survives a save
      }
    }
    enforceTurnWindow(); // after full replay, only the last 2 turns should be expanded
  }
}

function renderSessions(sessions, active) {
  sessionListEl.innerHTML = '';
  for (const s of sessions) {
    const row = document.createElement('div');
    row.className = 'sb-item' + (s.name === active ? ' active' : '');
    const branchTag = s.branchedFrom ? `<span class="meta" title="branched from ${escapeHtml(s.branchedFrom)}">⑂</span>` : '';
    row.innerHTML = `<span class="sb-item-name" title="double-click to rename">${escapeHtml(s.name)}</span><span class="sb-item-actions">${branchTag}<span class="meta">${s.turns}</span><span class="rename" data-name="${escapeHtml(s.name)}" title="rename">✎</span><span class="archive" data-name="${escapeHtml(s.name)}" title="archive">🗄</span><span class="del" data-name="${escapeHtml(s.name)}">✕</span></span>`;
    row.addEventListener('click', (e) => {
      if (e.target.classList.contains('del') || e.target.classList.contains('rename') || e.target.classList.contains('archive')) return;
      switchSession(s.name);
    });
    row.querySelector('.sb-item-name').addEventListener('dblclick', (e) => {
      e.stopPropagation();
      renameSessionPrompt(s.name);
    });
    row.querySelector('.rename').addEventListener('click', (e) => {
      e.stopPropagation();
      renameSessionPrompt(s.name);
    });
    row.querySelector('.archive').addEventListener('click', async (e) => {
      e.stopPropagation();
      await fetch('/api/session/archive', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name: s.name }) });
      refreshState();
    });
    row.querySelector('.del').addEventListener('click', async (e) => {
      e.stopPropagation();
      await fetch('/api/session/delete', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name: s.name }) });
      refreshState();
    });
    sessionListEl.appendChild(row);
  }
}

function renderArchivedList(sessions) {
  const el = document.getElementById('archived-list');
  if (!sessions.length) { el.innerHTML = `<div class="sb-item" style="cursor:default"><span style="color:var(--dim)">none archived</span></div>`; return; }
  el.innerHTML = sessions.map(s => `
    <div class="sb-item">
      <span class="sb-item-name">${escapeHtml(s.name)}</span>
      <span class="sb-item-actions">
        <span class="meta">${s.turns}</span>
        <span class="restore" data-name="${escapeHtml(s.name)}" title="restore">↩</span>
        <span class="del" data-name="${escapeHtml(s.name)}" title="delete forever">✕</span>
      </span>
    </div>`).join('');
  el.querySelectorAll('.restore').forEach(btn => btn.addEventListener('click', async () => {
    await fetch('/api/session/unarchive', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name: btn.dataset.name }) });
    refreshState();
    refreshArchivedList();
  }));
  el.querySelectorAll('.del').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm(`Permanently delete "${btn.dataset.name}"? This can't be undone.`)) return;
    await fetch('/api/session/delete', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name: btn.dataset.name }) });
    refreshArchivedList();
  }));
}

async function refreshArchivedList() {
  const res = await fetch('/api/sessions/archived');
  const data = await res.json();
  renderArchivedList(data.sessions || []);
}

document.getElementById('show-archived-btn').addEventListener('click', () => {
  const el = document.getElementById('archived-list');
  const showing = el.style.display !== 'none';
  el.style.display = showing ? 'none' : 'block';
  if (!showing) refreshArchivedList();
});

async function renameSessionPrompt(oldName) {
  const newName = prompt('Rename chat:', oldName);
  if (!newName || !newName.trim() || newName.trim() === oldName) return;
  const res = await fetch('/api/session/rename', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ oldName, newName: newName.trim() }) });
  const data = await res.json();
  if (!data.ok) { appendErrorMessage(`Couldn't rename: ${data.error}`); return; }
  refreshState();
}

async function switchSession(name) {
  await fetch('/api/session/switch', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name }) });
  refreshState();
}

document.getElementById('new-session-btn').onclick = async () => {
  const name = prompt('Name this chat (optional):', '');
  await fetch('/api/session/new', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name: name || undefined }) });
  refreshState();
};

// ---------- file upload ----------
document.getElementById('upload-file-btn').addEventListener('click', () => {
  document.getElementById('file-upload-input').click();
});

document.getElementById('file-upload-input').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  e.target.value = ''; // reset so selecting the same file again still fires 'change'
  if (!files.length) return;
  for (const file of files) await uploadOneFile(file);
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]); // strip the data: URL prefix, keep raw base64
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadOneFile(file) {
  try {
    const contentBase64 = await fileToBase64(file);
    const res = await fetch('/api/upload', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ filename: file.name, contentBase64 })
    });
    const data = await res.json();
    if (!data.ok) { appendErrorMessage(`Couldn't upload ${file.name}: ${data.error}`); return; }
    appendUploadNote(`📎 Uploaded \`${data.relativePath}\` (${(data.bytes / 1024).toFixed(1)} KB) — mention it by name in your next message to have the agent use it.`);
  } catch (err) {
    appendErrorMessage(`Couldn't upload ${file.name}: ${err.message}`);
  }
}

// ---------- sidebar: bookmarked projects (arbitrary folders, persistent) ----------
function renderBookmarks(bookmarks, currentRoot) {
  const listEl = document.getElementById('bookmark-list');
  listEl.innerHTML = '';
  if (!bookmarks || bookmarks.length === 0) {
    const row = document.createElement('div');
    row.className = 'sb-item';
    row.style.cursor = 'default';
    row.innerHTML = `<span style="color:var(--dim)">none yet</span>`;
    listEl.appendChild(row);
    return;
  }
  for (const b of bookmarks) {
    const row = document.createElement('div');
    row.className = 'sb-item' + (b.path === currentRoot ? ' active' : '');
    const tag = b.isGit ? ' 🔧' : '';
    row.innerHTML = `<span title="${escapeHtml(b.path)}">${escapeHtml(b.name)}${tag}</span><span class="del" data-path="${escapeHtml(b.path)}">✕</span>`;
    row.addEventListener('click', (e) => {
      if (e.target.classList.contains('del')) return;
      cdToAbsolute(b.path);
    });
    row.querySelector('.del').addEventListener('click', async (e) => {
      e.stopPropagation();
      await fetch('/api/bookmarks/remove', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ path: b.path }) });
      refreshState();
    });
    listEl.appendChild(row);
  }
}

async function cdToAbsolute(absPath) {
  await fetch('/api/cd', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ dir: absPath }) });
  refreshState();
}

async function addBookmark(rawPath, name) {
  const res = await fetch('/api/bookmarks/add', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ path: rawPath, name }) });
  const data = await res.json();
  if (!data.ok) { appendErrorMessage(`Couldn't add bookmark: ${data.error}`); return; }
  refreshState();
}

// ---------- folder browser modal ----------
let browseCurrentPath = null;
let browseParentPath = null;

async function openBrowser(startDir) {
  browseOverlay.classList.add('show');
  await navigateBrowser(startDir || rootPathEl.textContent);
}

async function navigateBrowser(dir) {
  browseErrorEl.textContent = '';
  browseListEl.innerHTML = `<div class="browse-empty">Loading…</div>`;
  const res = await fetch(`/api/browse?dir=${encodeURIComponent(dir)}`);
  const data = await res.json();
  if (!data.ok && !data.path) {
    browseErrorEl.textContent = data.error || 'Could not open that folder';
    return;
  }
  browseCurrentPath = data.path;
  browseParentPath = data.parent;
  browsePathEl.textContent = data.path;
  if (data.error) browseErrorEl.textContent = data.error;

  browseListEl.innerHTML = '';
  if (browseParentPath) {
    const up = document.createElement('div');
    up.className = 'browse-row';
    up.innerHTML = `<span class="icon">↑</span><span>..</span>`;
    up.addEventListener('click', () => navigateBrowser(browseParentPath));
    browseListEl.appendChild(up);
  }
  if (data.entries.length === 0 && !browseParentPath) {
    browseListEl.innerHTML += `<div class="browse-empty">No subfolders here</div>`;
  }
  for (const name of data.entries) {
    const row = document.createElement('div');
    row.className = 'browse-row';
    row.innerHTML = `<span class="icon">▸</span><span>${escapeHtml(name)}</span>`;
    row.addEventListener('click', () => navigateBrowser(`${data.path}/${name}`));
    browseListEl.appendChild(row);
  }
}

function closeBrowser() { browseOverlay.classList.remove('show'); }

document.getElementById('browse-folder-btn').addEventListener('click', () => openBrowser());
document.getElementById('browse-close-btn').addEventListener('click', closeBrowser);
document.getElementById('browse-cancel-btn').addEventListener('click', closeBrowser);
document.getElementById('browse-select-btn').addEventListener('click', async () => {
  if (!browseCurrentPath) return;
  closeBrowser();
  await addBookmark(browseCurrentPath);
});

providerSelect.addEventListener('change', async () => {
  await fetch('/api/provider', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name: providerSelect.value }) });
  refreshState();
});

modeSelect.addEventListener('change', async () => {
  await fetch('/api/mode', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ mode: modeSelect.value }) });
  refreshState();
});

// ---------- auto model routing ----------
let autoModeOn = false;
let autoProfileCurrent = 'hardware';

function formatAAStatus(aaStatus) {
  if (!aaStatus || !aaStatus.configured) return 'static lists (no AA_API_KEY set)';
  if (aaStatus.error) return `AA error: ${aaStatus.error}`;
  if (!aaStatus.fetchedAt) return 'fetching live rankings…';
  const mins = Math.round((Date.now() - new Date(aaStatus.fetchedAt).getTime()) / 60000);
  const ago = mins < 1 ? 'just now' : mins < 60 ? `${mins}m ago` : `${Math.round(mins / 60)}h ago`;
  return `live rankings · ${aaStatus.modelCount} models · updated ${ago}`;
}

function setAutoModeUI(on, currentModel, profiles, activeProfile, aaStatus) {
  autoModeOn = on;
  autoToggle.classList.toggle('active', on);
  autoProfileCurrent = activeProfile || autoProfileCurrent;

  if (profiles && profiles.length && autoProfileSelect.options.length === 0) {
    autoProfileSelect.innerHTML = profiles.map(p => `<option value="${p.id}">${escapeHtml(p.label)}</option>`).join('');
  }
  autoProfileSelect.value = autoProfileCurrent;
  autoProfileSelect.style.display = on ? 'inline-block' : 'none';
  aaStatusEl.style.display = on ? 'inline' : 'none';
  aaRefreshBtn.style.display = (on && aaStatus?.configured) ? 'inline-flex' : 'none';
  if (aaStatus) aaStatusEl.textContent = formatAAStatus(aaStatus);

  if (on) {
    modelInput.value = currentModel || 'auto';
    modelInput.disabled = true;
    modelInput.placeholder = 'auto-selecting…';
  } else {
    modelInput.disabled = false;
    modelInput.value = currentModel || '';
  }
}

autoToggle.addEventListener('click', async () => {
  const next = !autoModeOn;
  const res = await fetch('/api/automode', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ enabled: next }) });
  const data = await res.json();
  if (data.warning) appendErrorMessage(data.warning);
  refreshState();
});

autoProfileSelect.addEventListener('change', async () => {
  const res = await fetch('/api/automode', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ enabled: true, profile: autoProfileSelect.value }) });
  const data = await res.json();
  if (data.warning) appendErrorMessage(data.warning);
  refreshState();
});

aaRefreshBtn.addEventListener('click', async () => {
  aaRefreshBtn.classList.add('loading');
  const res = await fetch('/api/automode/refresh', { method: 'POST' });
  const data = await res.json();
  if (!data.ok && data.error) appendErrorMessage(`Couldn't refresh rankings: ${data.error}`);
  aaRefreshBtn.classList.remove('loading');
  refreshState();
});

// ---------- model selection ----------
const CURATED_MODELS = {
  openrouter: [
    'openai/gpt-4o', 'openai/gpt-4o-mini', 'openai/gpt-4.1', 'openai/o3-mini',
    'anthropic/claude-sonnet-4.6', 'anthropic/claude-3.5-haiku',
    'google/gemini-2.0-flash-001', 'google/gemini-2.5-pro',
    'meta-llama/llama-3.3-70b-instruct', 'mistralai/mistral-large',
    'deepseek/deepseek-chat', 'qwen/qwen-2.5-72b-instruct'
  ],
  openai: ['gpt-4o', 'gpt-4o-mini', 'gpt-4.1', 'o3-mini'],
  groq: ['llama-3.3-70b-versatile', 'llama-3.1-8b-instant', 'mixtral-8x7b-32768'],
  anthropic: ['claude-sonnet-4-6', 'claude-opus-4-8', 'claude-haiku-4-5-20251001'],
  ollama: ['llama3.1', 'qwen2.5-coder', 'mistral']
};

function normalizeModelList(list) {
  // curated fallback entries are plain strings; live-fetched entries are {id, price} — normalize both to the same shape
  return list.map(m => typeof m === 'string' ? { id: m, price: null } : m);
}

function formatPricePerM(n) {
  if (n === 0) return 'free';
  if (n >= 10) return '$' + n.toFixed(0);
  if (n >= 1) return '$' + n.toFixed(1);
  return '$' + n.toFixed(2);
}

function priceLabel(price) {
  if (!price) return '';
  if (price.promptPerM === 0 && price.completionPerM === 0) return 'free';
  return `${formatPricePerM(price.promptPerM)} in / ${formatPricePerM(price.completionPerM)} out per M`;
}

function populateModelOptions(models) {
  currentModelList = normalizeModelList(models);
  renderModelDropdown(modelInput.value);
}

let currentModelList = [];
let highlightedIndex = -1;

function renderModelDropdown(filterText) {
  const q = (filterText || '').toLowerCase().trim();
  const matches = q ? currentModelList.filter(m => m.id.toLowerCase().includes(q)) : currentModelList;
  highlightedIndex = -1;

  if (matches.length === 0) {
    modelDropdown.innerHTML = `<div class="model-dropdown-empty">${currentModelList.length === 0 ? 'No models loaded — click ↻' : 'No matches — press Enter to use this as a custom model id'}</div>`;
    return;
  }
  modelDropdown.innerHTML = matches.map((m, i) => {
    const label = priceLabel(m.price);
    return `<div class="model-opt" data-idx="${i}" data-model="${escapeHtml(m.id)}">
      <span class="model-opt-id">${escapeHtml(m.id)}</span>
      ${label ? `<span class="model-opt-price">${escapeHtml(label)}</span>` : ''}
    </div>`;
  }).join('');
  modelDropdown._matches = matches; // stash for keyboard nav / click handlers

  modelDropdown.querySelectorAll('.model-opt').forEach(el => {
    el.addEventListener('mousedown', (e) => {
      e.preventDefault(); // keep focus on input, avoid premature blur
      selectModel(el.dataset.model);
    });
  });
}

function showDropdown() { renderModelDropdown(modelInput.value); modelDropdown.classList.add('show'); }
function hideDropdown() { modelDropdown.classList.remove('show'); }

function selectModel(id) {
  modelInput.value = id;
  hideDropdown();
  commitModel();
}

async function fetchModelList(providerNameForFetch) {
  // show curated list immediately so the field is useful even before/without a live fetch
  populateModelOptions(CURATED_MODELS[providerNameForFetch] || []);
  modelRefreshBtn.classList.add('loading');
  try {
    const res = await fetch(`/api/models?provider=${encodeURIComponent(providerNameForFetch)}`);
    const data = await res.json();
    if (data.ok && data.models?.length) populateModelOptions(data.models);
    // if it fails (offline, no key, provider doesn't support listing), the curated list already showing is the fallback — no error shown, this is a nice-to-have
  } catch { /* silent — curated list already populated */ }
  modelRefreshBtn.classList.remove('loading');
}

async function commitModel() {
  const newModel = modelInput.value.trim();
  if (!newModel) return;
  await fetch('/api/provider', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name: providerSelect.value, model: newModel }) });
}

modelInput.addEventListener('focus', showDropdown);
modelInput.addEventListener('input', () => renderModelDropdown(modelInput.value) || modelDropdown.classList.add('show'));
modelInput.addEventListener('blur', () => { setTimeout(hideDropdown, 120); commitModel(); }); // slight delay so mousedown-select fires first
modelInput.addEventListener('keydown', (e) => {
  const matches = modelDropdown._matches || [];
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (!matches.length) return;
    highlightedIndex = Math.min(highlightedIndex + 1, matches.length - 1);
    updateHighlight();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (!matches.length) return;
    highlightedIndex = Math.max(highlightedIndex - 1, 0);
    updateHighlight();
  } else if (e.key === 'Enter') {
    if (highlightedIndex >= 0 && matches[highlightedIndex]) {
      selectModel(matches[highlightedIndex].id);
    } else {
      hideDropdown();
      modelInput.blur();
    }
  } else if (e.key === 'Escape') {
    hideDropdown();
  }
});
function updateHighlight() {
  modelDropdown.querySelectorAll('.model-opt').forEach((el, i) => el.classList.toggle('highlighted', i === highlightedIndex));
  const el = modelDropdown.querySelector('.model-opt.highlighted');
  if (el) el.scrollIntoView({ block: 'nearest' });
}

modelRefreshBtn.addEventListener('click', () => { fetchModelList(providerSelect.value); modelInput.focus(); });

refreshState();
</script>
